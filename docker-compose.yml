services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      FLOWGUARD_DATA_DIR: /app/data
    volumes:
      - flowguard-data:/app/data
    ports:
      - '127.0.0.1:8000:8000'
  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend
volumes:
  flowguard-data:
